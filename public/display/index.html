<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hum-a-Tune — Display</title>
  <link rel="icon" href="/shared/icone.svg">
  <link rel="stylesheet" href="/shared/neoretro.css">
  <style>
    body {
      display: grid; grid-template-columns: 1fr clamp(260px, 24vw, 360px);
      gap: clamp(12px, 2vw, 24px); padding: clamp(12px, 2vw, 24px);
    }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header .logo { height: clamp(52px, 6vw, 84px); margin: 0; }
    .btn-som, #btn-reiniciar { font-size: 0.85rem; padding: 8px 14px; }
    .btn-som { font-size: 1.2rem; }
    main { display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2vw, 24px); }
    .timer {
      width: clamp(170px, 24vw, 320px); height: clamp(170px, 24vw, 320px); border-radius: 50%;
      border: 10px solid var(--primary); box-shadow: var(--shadow), inset 0 0 0 4px var(--outline);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(3rem, 8vw, 6.5rem); font-weight: 800; background: var(--surface-bright);
    }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      aside { order: 2; }
    }
    body:has(#painel-ranking.oculto) { grid-template-columns: 1fr; }
    .timer.urgente { border-color: var(--error); }
    .modo { font-size: clamp(1.1rem, 2vw, 1.8rem); background: var(--secondary); }
    .modo.cantarolar { background: var(--tertiary); }
    .valor { font-size: clamp(1.5rem, 3vw, 2.6rem); background: var(--primary); }
    .dupla-card {
      display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2vw, 20px);
      font-size: clamp(1.1rem, 2.2vw, 1.9rem); font-weight: 800; flex-wrap: wrap;
    }
    #ranking li { font-size: clamp(1rem, 1.6vw, 1.4rem); margin: 8px 0; }
    #qr { width: min(240px, 55vw); height: auto; }
    .evento { color: var(--secondary-dark); font-weight: 800; min-height: 1.5em; }
    .presenca { background: var(--error); color: #fff; }
    .codigo {
      display: block; margin: 8px auto 16px; width: fit-content; max-width: 100%;
      font-size: clamp(1.8rem, 4.5vw, 3.2rem); letter-spacing: clamp(5px, 1vw, 12px);
      padding: 8px 20px 8px 30px; background: var(--primary);
    }
    .jogador-lobby { display: inline-flex; align-items: center; gap: 6px; margin: 0 6px; }
    .grupo-dupla { margin: 14px 0; }
    .fileira-avatares { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
    .card-jogador {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      position: relative; animation: flutuar 3s ease-in-out infinite;
    }
    .card-jogador.off { opacity: 0.45; animation: none; }
    .card-jogador .mini-avatar svg { width: 76px; height: 76px; }
    .nome-jogador { font-weight: 800; }
    @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .card-jogador.pulo { animation: pular 0.8s ease; }
    @keyframes pular {
      0% { transform: scale(1); } 30% { transform: scale(1.25) rotate(-6deg); }
      60% { transform: scale(0.95) rotate(4deg); } 100% { transform: scale(1); }
    }
    .emote-flutuante {
      position: absolute; top: -8px; left: 50%; font-size: 2.2rem;
      animation: subir 1.6s ease forwards; pointer-events: none; z-index: 5;
    }
    @keyframes subir { to { transform: translate(-50%, -70px); opacity: 0; } }
    .dupla-card .mini-avatar svg { width: 56px; height: 56px; vertical-align: middle; }
    .avatar-ranking svg { width: 26px; height: 26px; vertical-align: middle; margin-right: 2px; }
    .remover-jogador {
      border: 2px solid var(--outline); border-radius: 999px; background: var(--error);
      color: #fff; font-weight: 800; cursor: pointer; width: 22px; height: 22px;
      line-height: 1; padding: 0; font-size: 0.8rem;
    }
    #btn-reiniciar { font-size: 0.85rem; padding: 8px 16px; margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 class="logo logo-humatune" aria-label="Hum-a-Tune"></h1>
    <span id="aviso" class="pill oculto"></span>
    <span id="presenca" class="pill presenca oculto"></span>
    <p id="evento" class="evento"></p>
    <span style="flex:1"></span>
    <button id="btn-som" class="btn btn-som" title="Música do lobby">🔇</button>
    <button id="btn-reiniciar" class="btn btn-error">↺ Reiniciar sala</button>
  </header>

  <main>
    <section id="tela-lobby" class="tela card" style="text-align:center">
      <h2>Escaneie para entrar</h2>
      <div id="codigo-sala" class="pill codigo"></div>
      <img id="qr" alt="QR code para entrar no jogo">
      <p id="url-entrada" style="font-weight:800"></p>
      <div id="lobby-duplas"></div>
      <button id="btn-iniciar" class="btn btn-success">Começar partida</button>
    </section>

    <section id="tela-rodada" class="tela oculto" style="display:contents">
      <span id="rodada-info" class="pill"></span>
      <span id="modo" class="pill modo"></span>
      <div class="timer" id="timer"><span id="tempo">90</span></div>
      <div class="card dupla-card">
        <span class="mini-avatar" id="avatar-apresentador"></span>
        <span>🎤 <span id="apresentador"></span></span>
        <span>→</span>
        <span class="mini-avatar" id="avatar-adivinhador"></span>
        <span>🤔 <span id="adivinhador"></span></span>
        <span id="valor" class="pill valor"></span>
      </div>
    </section>

    <section id="tela-resultado" class="tela card oculto" style="text-align:center">
      <h2 id="resultado-titulo"></h2>
      <p id="resultado-musica" style="font-size:1.4rem"></p>
      <p id="resultado-pontos" style="font-size:2rem;font-weight:800"></p>
    </section>

    <section id="tela-fim" class="tela card oculto" style="text-align:center">
      <h2>🏆 Fim de jogo!</h2>
      <div id="podio" style="font-size:1.6rem;font-weight:800"></div>
    </section>
  </main>

  <aside id="painel-ranking" class="card">
    <h2>🏆 Ranking</h2>
    <ol id="ranking"></ol>
    <p id="progresso" class="pill"></p>
  </aside>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/avatar.js"></script>
  <script src="/shared/logo.js"></script>
  <script src="/shared/chiptune.js"></script>
  <script src="./app.js"></script>
</body>
</html>
