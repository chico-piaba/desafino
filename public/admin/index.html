<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hum-a-Tune — Admin</title>
  <link rel="icon" href="/shared/icone.svg">
  <link rel="stylesheet" href="/shared/neoretro.css">
  <style>
    body { padding: clamp(12px, 3vw, 24px); max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--outline); }
    .linha-form { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr auto; gap: 12px; align-items: end; }
    @media (max-width: 700px) {
      .linha-form { grid-template-columns: 1fr 1fr; }
      .linha-form button { grid-column: 1 / -1; }
    }
    .resultado-wiki { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; flex-wrap: wrap; }
    .erro { color: #93000a; font-weight: 800; min-height: 1.4em; }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <h1 class="logo logo-humatune" aria-label="Hum-a-Tune" style="height:52px;margin:0"></h1>
    <span class="pill">Banco de músicas</span>
  </div>
  <script src="/shared/logo.js"></script>
  <p id="erro" class="erro" role="alert"></p>

  <section class="card">
    <h2>🔎 Buscar música (iTunes)</h2>
    <div style="display:flex;gap:12px">
      <input id="campo-busca" placeholder="Nome da música ou artista…">
      <button id="btn-buscar" class="btn btn-tertiary">Buscar</button>
    </div>
    <div id="resultados-wiki"></div>
  </section>

  <section class="card">
    <h2>➕ Adicionar música</h2>
    <div class="linha-form">
      <label>Título <input id="campo-titulo"></label>
      <label>Artista <input id="campo-artista"></label>
      <label>Ano <input id="campo-ano" type="number" min="1900" max="2100"></label>
      <label>Gênero <input id="campo-genero" placeholder="opcional"></label>
      <button id="btn-adicionar" class="btn btn-success">Salvar</button>
    </div>
  </section>

  <section class="card">
    <h2>🎵 Músicas (<span id="total"></span>)</h2>
    <table>
      <thead><tr><th>Título</th><th>Artista</th><th>Ano</th><th>Gênero</th><th></th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </section>

  <script src="./app.js"></script>
</body>
</html>
