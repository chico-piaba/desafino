# DESAFINO numa VPS: docker compose up -d
# A imagem é publicada pelo CI em ghcr.io/chico-piaba/desafino a cada push.
# O volume "dados" guarda data/musicas.json — músicas adicionadas pelo /admin
# sobrevivem a atualizações (na primeira subida ele é semeado com as 510 do repo).
services:
  desafino:
    image: ghcr.io/chico-piaba/desafino:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dados:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/musicas"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dados:
