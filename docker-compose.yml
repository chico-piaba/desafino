# Hum-a-Tune numa VPS: docker compose up -d
# A imagem é publicada pelo CI em ghcr.io/chico-piaba/hum-a-tune a cada push.
# O volume "dados" guarda data/musicas.json — músicas adicionadas pelo /admin
# sobrevivem a atualizações (na primeira subida ele é semeado com as 510 do repo).
services:
  hum-a-tune:
    image: ghcr.io/chico-piaba/hum-a-tune:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Sem valor, o servidor gera um token aleatório e imprime no log do container.
      - MONITOR_TOKEN=${MONITOR_TOKEN:-}
    volumes:
      - dados:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/musicas"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dados:
